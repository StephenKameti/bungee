<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"Fraunces"; src:url("assets/fonts/fraunces.woff2") format("woff2"); font-weight:100 900; font-style:normal; }
  @font-face { font-family:"Fraunces"; src:url("assets/fonts/fraunces-italic.woff2") format("woff2"); font-weight:100 900; font-style:italic; }
  @font-face { font-family:"Manrope"; src:url("assets/fonts/manrope-400.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Manrope"; src:url("assets/fonts/manrope-500.woff2") format("woff2"); font-weight:500; }
  @font-face { font-family:"Manrope"; src:url("assets/fonts/manrope-600.woff2") format("woff2"); font-weight:600; }
  @font-face { font-family:"Manrope"; src:url("assets/fonts/manrope-700.woff2") format("woff2"); font-weight:700; }
  @font-face { font-family:"UI"; src:url("assets/fonts/ui-500.woff2") format("woff2"); font-weight:500; }
  :root { --paper:#F4EFE6; --paper2:#EDE6D9; --card:#FBF8F2; --line:#DED5C6; --ink:#17150F; --ink2:#4A453B; --muted:#7C7466;
          --holiday:#C07A1E; --religious:#7A4F9F; --cultural:#1E8A6E; --commercial:#D4523A; --sport:#2A5BD7; --seasonal:#6E8A2E; --sensitive:#8E1D1D; }
  html,body { margin:0; background:var(--paper); overflow:hidden; }
  #stage { position:relative; overflow:hidden; background:var(--paper); color:var(--ink); font-family:"Manrope",sans-serif; }
  #cam { position:absolute; inset:0; transform-origin:50% 50%; }
  .abs { position:absolute; left:50%; top:50%; white-space:nowrap; }
  .fr { font-family:"Fraunces",serif; font-weight:300; font-variation-settings:"opsz" 144,"SOFT" 40; letter-spacing:-0.035em; line-height:.92; }
  .frl { font-family:"Fraunces",serif; font-weight:300; font-variation-settings:"opsz" 144,"SOFT" 60; letter-spacing:-0.06em; line-height:.78; }
  .mr { font-family:"Manrope",sans-serif; font-weight:600; }
  #year span { display:inline-block; }
  #cord { position:absolute; left:50%; top:50%; width:8px; background:#BEFD50; border-radius:4px; }
  #tray { background:var(--paper2); border-radius:28px; }
  .scene { position:absolute; left:50%; top:50%; white-space:normal; }
  /* Ribbon (the almanac's year at a glance) */
  #rib { display:grid; grid-template-columns:repeat(12,1fr); }
  #rib .col { display:flex; flex-direction:column; gap:10px; }
  #rib .bars { display:flex; flex-direction:column-reverse; gap:3px; justify-content:flex-start; }
  #rib .bars i { display:block; border-radius:3px; transform-origin:0 50%; }
  #rib .lbl { font-weight:600; color:var(--muted); }
  #rib .lbl span { font-weight:400; }
  /* Chips and kick */
  .chip { display:inline-flex; align-items:center; gap:14px; border:2px solid var(--line); background:var(--card); border-radius:999px; padding:12px 26px; font:600 34px "Manrope"; }
  .chip i { width:16px; height:16px; border-radius:50%; display:block; }
  #kick { display:flex; align-items:center; gap:20px; font:600 28px "Manrope"; color:var(--muted); }
  #kick i { width:46px; height:2px; background:var(--ink); display:block; }
  /* Month strip */
  #ms { display:flex; gap:7px; }
  #ms div { display:flex; flex-direction:column; align-items:center; gap:8px; width:38px; }
  #ms i { display:block; width:38px; height:9px; border-radius:3px; background:var(--line); }
  #ms span { font:700 18px "Manrope"; color:var(--muted); }
  /* Almanac cards, scaled for video from the page's own CSS */
  .story { background:var(--card); border:2px solid var(--line); border-radius:22px; }
  .when { font:700 26px "Manrope"; letter-spacing:.01em; }
  .m { background:var(--card); border:2px solid var(--line); border-radius:20px; display:grid; grid-template-columns:10px 150px 1fr auto; overflow:hidden; }
  .m .tab { background:var(--c); }
  .m .d { padding:20px 0 20px 22px; }
  .m .d b { display:block; font:300 56px/1 "Fraunces"; font-variation-settings:"opsz" 144; letter-spacing:-.04em; }
  .m .d b.r { font-size:38px; }
  .m .d b small { font:400 .45em "Manrope"; color:var(--muted); margin:0 4px; letter-spacing:0; }
  .m .d span { display:block; font-size:18px; color:var(--muted); margin-top:6px; font-weight:500; }
  .m .body { padding:20px 22px 20px 8px; min-width:0; }
  .m h3 { font:400 32px/1.12 "Fraunces"; font-variation-settings:"opsz" 40; margin:0 0 10px; letter-spacing:-.01em; }
  .tags { display:flex; flex-wrap:wrap; gap:7px; }
  .tag { font-size:17px; font-weight:600; padding:3px 11px; border-radius:7px; background:var(--paper2); color:var(--ink2); }
  .tag.c { background:var(--c); color:#fff; } .tag.w { background:transparent; border:2px dashed var(--line); color:var(--muted); }
  .m p { margin:12px 0 0; font-size:21px; line-height:1.42; color:var(--ink2); font-weight:500; }
  .m p.avoid b { color:var(--sensitive); }
  .m.sens { border-color:#C9A9A2; }
  .m.sens .d { background:repeating-linear-gradient(135deg, rgba(142,29,29,.12) 0 8px, transparent 8px 16px); }
  .star { align-self:start; margin:18px 18px 0 0; border:2px solid var(--line); border-radius:50%; width:56px; height:56px; display:grid; place-items:center; color:var(--muted); box-sizing:border-box; }
  .star.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .picks { border:2px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:999px; padding:12px 24px; font:700 25px "Manrope"; display:inline-block; }
  .hook { display:flex; align-items:center; gap:14px; margin-top:16px; padding:14px 18px; border-radius:12px; background:var(--paper2); }
  .hook q { quotes:none; font:italic 400 25px/1.25 "Fraunces"; font-variation-settings:"opsz" 40,"SOFT" 60; flex:1; }
  .cp { border:2px solid var(--line); background:var(--card); border-radius:9px; padding:5px 13px; font:600 18px "Manrope"; }
  .file { display:flex; align-items:center; gap:18px; background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:14px 22px 14px 16px; box-shadow:0 18px 30px -18px rgba(23,21,15,.45); }
  #cursor { width:44px; height:44px; }
</style></head>
<body>
<div id="stage"><div id="cam">
  <div id="year" class="abs frl"><span>2</span><span>0</span><span>2</span><span>7</span></div>
  <div id="kick" class="abs"><i></i><span>A planner's almanac</span></div>
  <div id="sub" class="abs" style="font:italic 300 84px/1 'Fraunces';font-variation-settings:'opsz' 144,'SOFT' 60;letter-spacing:-.02em">is already booked.</div>
  <div id="rib" class="abs"></div>
  <div id="cnt" class="abs frl" style="text-align:center">0</div>
  <div id="cntl" class="abs mr" style="color:var(--muted)">moments</div>
  <div id="ch0" class="abs chip"><i style="background:var(--cultural)"></i>88 global</div>
  <div id="ch1" class="abs chip"><i style="background:var(--sport)"></i>8 regions</div>
  <div id="tray" class="abs"></div>
  <div id="k0" class="abs mr"></div><div id="h0" class="abs fr"></div>
  <div id="k1" class="abs mr"></div><div id="h1" class="abs fr"></div>
  <div id="k2" class="abs mr"></div><div id="h2" class="abs fr"></div>
  <div id="k3" class="abs mr"></div><div id="h3" class="abs fr"></div>
  <div id="k4" class="abs mr"></div><div id="h4" class="abs fr"></div>
  <div id="ms" class="abs"></div>
  <div id="s0" class="scene"></div><div id="s1" class="scene"></div><div id="s2" class="scene"></div><div id="s3" class="scene"></div><div id="s4" class="scene"></div>
  <div id="f1" class="abs fr" style="text-align:center">Every date.</div>
  <div id="f2" class="abs fr" style="text-align:center;font-style:italic">Every market.</div>
  <div id="logo" class="abs" style="aspect-ratio:1318/411">
    <img id="mark" src="assets/brand/mark-no-tick.png" style="position:absolute;inset:0;width:100%;height:100%">
    <img id="tick" src="assets/brand/tick.png" style="position:absolute;inset:0;width:100%;height:100%;transform-origin:64.7% 25%">
  </div>
  <div id="endline" class="abs" style="font:500 50px 'UI';color:#3F414B">Moments 2027 <span style="color:#5E6069">·</span> A planner's almanac</div>
  <svg id="cursor" class="abs" viewBox="0 0 44 44"><path d="M8 4 L8 34 L16 27 L22 40 L28 37 L22 25 L33 25 Z" fill="#17150F" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
  <div id="cord"></div>
</div></div>
<script src="lib/motion.js"></script>
<script src="lib/kit.js"></script>
<script>
const { clamp, lerp, prog, E, SPRING, spring, keyed, grid, cue } = M;
const { W, H, S, wide, portrait, BUNGEE, C, $, landTime, place, life, slam, keyedColor, cord, fit } = K;
const square = !wide && !portrait;
const b = grid(window.BEATS, 120).beat, LAND = landTime(BUNGEE);
const HW = W / S / 2, HH = H / S / 2;
const A = { paper: "#F4EFE6", paper2: "#EDE6D9", card: "#FBF8F2", line: "#DED5C6", ink: "#17150F", ink2: "#4A453B", muted: "#7C7466" };
const CV = { Holiday: "#C07A1E", Religious: "#7A4F9F", Cultural: "#1E8A6E", Commercial: "#D4523A", Sport: "#2A5BD7", Seasonal: "#6E8A2E", Sensitive: "#8E1D1D" };

// ---------- Data: every item below is copied from the shipped almanac (moments-2027.json) ----------
const MONTHS = [["Holiday","Holiday","Commercial","Holiday","Commercial","Commercial","Holiday","Sport","Sensitive","Holiday","Sensitive"],["Holiday","Cultural","Cultural","Cultural","Cultural","Holiday","Holiday","Religious","Religious","Religious","Religious","Sport","Commercial","Commercial","Holiday","Cultural"],["Cultural","Seasonal","Commercial","Commercial","Religious","Religious","Holiday","Commercial","Cultural","Cultural","Cultural","Holiday","Holiday","Holiday","Holiday"],["Commercial","Commercial","Cultural","Holiday","Sensitive","Cultural","Religious","Sport","Religious","Commercial","Sensitive","Holiday","Holiday","Holiday","Sport"],["Holiday","Holiday","Religious","Cultural","Commercial","Commercial","Religious","Religious","Sport","Religious","Cultural","Holiday"],["Holiday","Cultural","Religious","Sport","Commercial","Commercial","Cultural","Holiday","Commercial","Cultural","Sport","Sport","Commercial","Commercial","Seasonal","Sport","Sensitive","Sport"],["Holiday","Holiday","Cultural","Cultural","Sport","Holiday","Holiday","Holiday","Commercial","Sensitive","Holiday","Sport","Sport","Commercial"],["Commercial","Cultural","Holiday","Cultural","Holiday","Sensitive","Cultural","Religious","Holiday","Religious","Religious"],["Cultural","Religious","Sensitive","Cultural","Cultural","Holiday","Cultural"],["Holiday","Holiday","Sport","Religious","Commercial","Seasonal","Sport","Religious","Holiday","Commercial","Religious","Holiday","Holiday","Religious","Holiday","Holiday","Religious","Sensitive","Religious","Commercial"],["Cultural","Commercial","Cultural","Sensitive","Commercial","Holiday","Commercial","Commercial"],["Sensitive","Commercial","Commercial","Holiday","Holiday","Seasonal","Religious","Holiday","Holiday","Holiday","Holiday","Commercial","Commercial"]];
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const rng = (a, z) => `<b class="r">${a}<small>to</small>${z}</b>`;
const OCT = [{ d: rng(1, 3) + "<span>From Friday</span>", t: "Rosh Hashanah", c: "Religious", g: ["Worldwide"] },
  { d: rng(1, 7) + "<span>From Friday</span>", t: "Golden Week (China)", c: "Holiday", g: ["Asia Pacific"] },
  { d: rng(27, 31) + "<span>From Wednesday</span>", t: "Diwali", c: "Religious", g: ["South Asia"] },
  { d: "<b>31</b><span>Sunday</span>", t: "Halloween", c: "Commercial", g: ["Worldwide"] }];
const NOV = [{ d: rng(1, 2) + "<span>From Monday</span>", t: "Día de los Muertos", c: "Cultural", g: ["Americas"] },
  { d: "<b>11</b><span>Thursday</span>", t: "Remembrance and Veterans Day", c: "Sensitive", g: ["Europe", "Americas"], p: "Poppies in the Commonwealth, Veterans Day in the US, Armistice in France. Respect only.", avoid: "Sales." },
  { d: "<b>11</b><span>Thursday</span>", t: "Singles' Day", c: "Commercial", g: ["Asia Pacific"] }];
const PICKS = [{ d: rng(5, 11) + "<span>From Friday</span>", t: "Lunar New Year, Year of the Goat", c: "Holiday", g: ["Asia Pacific"] },
  { d: "<b>22</b><span>Monday</span>", t: "Holi", c: "Cultural", g: ["South Asia"], w: "Expected date" },
  { d: rng(27, 31) + "<span>From Wednesday</span>", t: "Diwali", c: "Religious", g: ["South Asia"] }];
const STAR = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`;
function mcard(r, o = {}) {
  const tags = `<span class="tag c">${r.c === "Sensitive" ? "Sensitive, go quiet" : r.c}</span>` + r.g.map(x => `<span class="tag">${x}</span>`).join("") + (r.w ? `<span class="tag w">${r.w}</span>` : "");
  return `<div class="m ${r.c === "Sensitive" ? "sens" : ""} ${o.cls || ""}" style="--c:${CV[r.c]}${o.h3 ? ";" : ""}"><div class="tab"></div><div class="d">${r.d}</div><div class="body"><h3 style="${o.h3 ? "font-size:" + o.h3 + "px" : ""}">${r.t}</h3><div class="tags">${tags}</div>` +
    (r.p ? `<p>${r.p}</p>` : "") + (r.avoid ? `<p class="avoid"><b>Avoid.</b> ${r.avoid}</p>` : "") + `</div>` + (o.star ? `<div class="star">${STAR}</div>` : "") + `</div>`;
}

// ---------- Timeline on the measured beat grid ----------
const T = { d: [b(0), b(1), b(2), b(3)], sub: b(4), rib: b(5), cnt: b(8), chips: b(10), sec: [b(12), b(16), b(20), b(24), b(28)], out: b(32),
  stars: [b(25), b(25.5), b(26)], pick: b(27), touch: b(30), fin: [b(32), b(33)], logo: b(36), tick: b(37), endline: b(38), end: b(42) };
window.DURATION = +T.end.toFixed(3);

// ---------- Layout ----------
const LAY = wide
  ? { yearFs: 470, yearY: -170, subY: 70, ribY: 300, ribW: 1500, barH: 9, lblFs: 22, cntFs: 400, cntY: -90, cntLY: 200, chY: 300, chX: 170,
      mastX: -HW + 120, mastY: -HH + 96, mastFs: 72, txtX: -HW + 120, kY: -150, hY: -90, hlSize: 112, txtW: 760, msY: 150,
      bx: 440, by: 40, bw: 860, box: [[860, 620], [860, 640], [860, 640], [860, 720], [860, 600]], finFs: 170, finY: -120, ribY2: 330, logoW: 1000, endY: 190 }
  : portrait
  ? { yearFs: 330, yearY: -270, subY: -50, ribY: 220, ribW: 960, barH: 8, lblFs: 21, cntFs: 330, cntY: -140, cntLY: 170, chY: 300, chX: 0,
      mastX: -HW + 70, mastY: -HH + 100, mastFs: 64, txtX: 0, kY: -760, hY: -690, hlSize: 118, txtW: 960, msY: -405,
      bx: 0, by: 220, bw: 960, box: [[960, 760], [960, 1000], [960, 900], [960, 980], [960, 980]], finFs: 150, finY: -230, ribY2: 380, logoW: 860, endY: 170 }
  : { yearFs: 330, yearY: -230, subY: -40, ribY: 230, ribW: 960, barH: 7, lblFs: 20, cntFs: 300, cntY: -120, cntLY: 150, chY: 260, chX: 170,
      mastX: -HW + 70, mastY: -HH + 64, mastFs: 52, txtX: 0, kY: -400, hY: -345, hlSize: 84, txtW: 960, msY: -228,
      bx: 0, by: 150, bw: 960, box: [[960, 560], [960, 600], [960, 600], [960, 680], [960, 600]], finFs: 130, finY: -150, ribY2: 330, logoW: 860, endY: 170 };
const SEC = [
  { k: "February to March", h: "Two fasts,|one season.", ms: [1, 2], scene: "story" },
  { k: "Month by month", h: "October.|The busiest month.", ms: [9], scene: "october" },
  { k: "11 November", h: "Know when to|say nothing.", ms: [10], scene: "quiet" },
  { k: "Your picks", h: "Star it.|Export it.", ms: [1, 2, 9], scene: "picks" },
  { k: "24 and 25 December", h: "Hanukkah|meets Christmas.", ms: [11], scene: "together" }];
const SCW = i => LAY.box[i][0] - 72, SCH = i => LAY.box[i][1] - 72;

// ---------- Helpers ----------
const pop = (t, t0, cfg = SPRING.snappy) => clamp(spring(t - t0, cfg));
const ease = (t, t0, d) => E.outCubic(prog(t, t0, d));
function setO(el, o, tf) { el.style.opacity = o; el.style.visibility = o <= 0.002 ? "hidden" : "visible"; if (tf != null) el.style.transform = tf; }

// ---------- Scenes ----------
const G = {};                  // measured geometry for the cursor
const SCENES = {
  story: {
    html: (w, h) => { const cw = w - 88, x = d => +(d / 59 * cw).toFixed(1), ticks = [0, 7, 14, 21, 28, 35, 42, 49, 56];
      const BH = portrait ? 84 : square ? 60 : 72, fs = portrait ? 32 : square ? 26 : 28, rT = 54, lT = rT + BH + 18, lB = lT + BH, tT = lB + 26, kT = tT + 26, CH = kT + 58;
      return `<div class="story" style="position:absolute;inset:0;padding:34px 44px;box-sizing:border-box;display:flex;flex-direction:column">
      <span class="when" style="color:${CV.Religious}">February to March</span>
      <div style="position:relative;height:${CH}px;margin-top:${portrait ? 50 : 24}px">
        <span class="mr" style="position:absolute;left:0;top:0;font-size:22px;color:var(--muted)">February</span><span class="mr" style="position:absolute;left:${x(28) + 10}px;top:0;font-size:22px;color:var(--muted)">March</span>
        <i style="position:absolute;left:${x(28)}px;top:2px;height:${tT + 10}px;width:2px;background:var(--line)"></i>
        ${ticks.map(d => `<i style="position:absolute;left:${x(d)}px;top:${tT}px;width:2px;height:12px;background:var(--line)"></i>`).join("")}
        <div class="band" style="position:absolute;left:${x(9)}px;width:${x(37) - x(9)}px;top:${rT - 12}px;height:${lB - rT + 24}px;background:rgba(122,79,159,.12);border-radius:14px;border:2px dashed rgba(122,79,159,.5);box-sizing:border-box"></div>
        <div class="rb" style="position:absolute;left:${x(7)}px;width:${x(37) - x(7)}px;top:${rT}px;height:${BH}px;background:${CV.Religious};border-radius:12px;display:flex;align-items:center;padding:0 22px;box-sizing:border-box;transform-origin:0 50%"><span class="mr" style="color:#fff;font-size:${fs}px">Ramadan</span></div>
        <div class="lb" style="position:absolute;left:${x(9)}px;width:${x(55) - x(9)}px;top:${lT}px;height:${BH}px;background:var(--card);border:3px solid ${CV.Religious};border-radius:12px;display:flex;align-items:center;padding:0 22px;box-sizing:border-box;transform-origin:0 50%"><span class="mr" style="color:${CV.Religious};font-size:${fs}px">Lent</span></div>
        <div class="bk" style="position:absolute;left:${x(9)}px;width:${x(37) - x(9)}px;top:${kT}px;height:12px;border:3px solid ${CV.Religious};border-top:0;border-radius:0 0 6px 6px;box-sizing:border-box"></div>
        <span class="bl mr" style="position:absolute;left:${(x(9) + x(37)) / 2}px;top:${kT + 22}px;transform:translateX(-50%);font-size:${portrait ? 26 : 22}px;font-weight:700;color:${CV.Religious};white-space:nowrap">Together, 10 Feb to 9 Mar</span>
      </div>
      <p class="sp" style="margin:auto 0 0;font:500 ${portrait ? 30 : 24}px/1.4 'Manrope';color:var(--ink2)">Ramadan and Lent overlap almost entirely. A rare shared season of restraint across faiths.</p></div>`; },
    update(t, t0, t1, el) { const st = el.querySelector(".story"), p = pop(t, t0 + 0.02, SPRING.smooth); setO(st, life(t, t0 + 0.02, t1, 0.16, 0.2), `translateY(${(1 - p) * 50}px)`);
      const r = el.querySelector(".rb"), l = el.querySelector(".lb"), rp = ease(t, t0 + 0.3, 0.32), lp = ease(t, t0 + 0.55, 0.36);
      r.style.transform = `scaleX(${rp})`; r.style.opacity = rp > 0 ? 1 : 0; l.style.transform = `scaleX(${lp})`; l.style.opacity = lp > 0 ? 1 : 0;
      [r, l].forEach(e => e.firstChild.style.opacity = clamp(((e === r ? rp : lp) - 0.5) * 3));
      const bp = pop(t, t0 + 0.95, SPRING.snappy); setO(el.querySelector(".band"), clamp(bp * 1.5), `scale(${lerp(1.06, 1, bp)})`);
      const kp = ease(t, t0 + 1.0, 0.25); setO(el.querySelector(".bk"), kp, `scaleX(${lerp(0.3, 1, kp)})`); setO(el.querySelector(".bl"), clamp((t - t0 - 1.05) / 0.2), `translateX(-50%) translateY(${(1 - ease(t, t0 + 1.05, 0.3)) * 10}px)`);
      setO(el.querySelector(".sp"), life(t, t0 + 0.2, t1 + 0.2, 0.3, 0.2)); },
    cues: t0 => [[t0 + 0.3, "tick", 0.7], [t0 + 0.55, "tick", 0.7], [t0 + 0.95, "pop", 0.8]] },
  october: {
    html: (w, h) => { const mini = MONTHS[9].map(c => `<i style="display:block;width:16px;height:16px;border-radius:4px;background:${CV[c]}"></i>`).join("");
      const head = `<div class="oh" style="${portrait ? "display:flex;align-items:flex-end;gap:30px;margin-bottom:26px" : "width:220px;flex:none"}"><div><div class="fr" style="font-size:${portrait ? 96 : 68}px;letter-spacing:-.04em;font-variation-settings:'opsz' 144,'SOFT' 40">October</div>

  const tp = spring(t - T.tick, SPRING.tiny); $("tick").style.transform = `translateY(${(1 - clamp(tp)) * -60}px) scale(${lerp(0.3, 1, tp)})`; $("tick").style.opacity = clamp(tp * 3);
  const ep = spring(t - T.endline, SPRING.smooth); place($("endline"), 0, LAY.endY + (1 - clamp(ep)) * 26, 1, clamp(ep * 1.4));
  return true;
};
window.ready = Promise.all([
  ...["300 1em Fraunces", "400 1em Fraunces", "italic 300 1em Fraunces", "italic 400 1em Fraunces", "400 1em Manrope", "500 1em Manrope", "600 1em Manrope", "700 1em Manrope", "500 1em UI"].map(f => document.fonts.load(f)),
  ...[...document.images].map(i => i.decode())
]).then(() => document.fonts.ready).then(() => {
  const bad = [...document.fonts].filter(f => f.status === "error").map(f => f.family);
  if (bad.length) throw new Error("Font files failed to load: " + bad.join(", "));
  measure(); window.seek(0); return true;
});
</script>
